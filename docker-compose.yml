# Local PostgreSQL for backend development. Application processes run on the host.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-qr_studio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qr_studio}
      POSTGRES_DB: ${DB_DATABASE:-qr_studio}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP sink and web UI. Ports are published on loopback only.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
